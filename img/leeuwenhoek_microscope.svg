<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#E3F2FD"/>
  
  <!-- Retrato simplificado de Leeuwenhoek -->
  <g transform="translate(50, 50)">
    <circle cx="150" cy="100" r="60" fill="#FFCCBC" stroke="#E64A19" stroke-width="2"/>
    <path d="M 90 100 Q 150 180 210 100 L 210 200 Q 150 220 90 200 Z" fill="#5D4037"/>
    <circle cx="130" cy="90" r="8" fill="#FFFFFF"/>
    <circle cx="170" cy="90" r="8" fill="#FFFFFF"/>
    <circle cx="130" cy="90" r="3" fill="#3E2723"/>
    <circle cx="170" cy="90" r="3" fill="#3E2723"/>
    <path d="M 140 120 Q 150 130 160 120" stroke="#3E2723" stroke-width="2" fill="none"/>
    
    <!-- Microscópio de Leeuwenhoek -->
    <g transform="translate(250, 150)">
      <rect x="0" y="0" width="80" height="120" fill="#8D6E63" rx="5"/>
      <circle cx="40" cy="60" r="25" fill="#FFB74D" stroke="#F57C00" stroke-width="3"/>
      <circle cx="40" cy="60" r="15" fill="#FFE0B2" opacity="0.7"/>
      <line x1="40" y1="60" x2="40" y2="140" stroke="#5D4037" stroke-width="4"/>
      <rect x="20" y="140" width="40" height="10" fill="#5D4037" rx="3"/>
    </g>
    
    <text x="150" y="250" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1565C0">Antonie van Leeuwenhoek</text>
    <text x="150" y="275" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">(1632-1723)</text>
  </g>
  
  <!-- Microrganismos -->
  <g transform="translate(350, 50)">
    <rect width="200" height="200" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976D2">\"Animálculos\"</text>
    
    <!-- Protozoários simplificados -->
    <ellipse cx="60" cy="80" rx="20" ry="15" fill="#81C784" opacity="0.8"/>
    <circle cx="60" cy="80" r="5" fill="#2E7D32"/>
    <line x1="40" y1="80" x2="30" y2="80" stroke="#2E7D32" stroke-width="2"/>
    <line x1="80" y1="80" x2="90" y2="80" stroke="#2E7D32" stroke-width="2"/>
    
    <ellipse cx="140" cy="80" rx="15" ry="20" fill="#64B5F6" opacity="0.8"/>
    <circle cx="140" cy="80" r="5" fill="#1565C0"/>
    <line x1="140" y1="60" x2="140" y2="50" stroke="#1565C0" stroke-width="2"/>
    <line x1="140" y1="100" x2="140" y2="110" stroke="#1565C0" stroke-width="2"/>
    
    <!-- Bactérias -->
    <ellipse cx="80" cy="150" rx="15" ry="8" fill="#BA68C8" opacity="0.8"/>
    <ellipse cx="120" cy="150" rx="15" ry="8" fill="#BA68C8" opacity="0.8"/>
    <ellipse cx="160" cy="150" rx="15" ry="8" fill="#BA68C8" opacity="0.8"/>
    
    <text x="100" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Primeira observação de bactérias e protozoários (1674)</text>
  </g>
</svg>
