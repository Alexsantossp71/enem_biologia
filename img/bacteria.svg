<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <linearGradient id="bact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9C4"/><stop offset="1" stop-color="#FFE082"/>
    </linearGradient>
  </defs>
  <!-- Flagelos -->
  <g stroke="#4FC3F7" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M110 250 Q30 200 20 120 Q15 70 60 55"/>
    <path d="M110 250 Q10 250 -20 190 Q-40 150 -10 120"/>
    <path d="M110 250 Q30 300 10 360 Q-5 400 40 420"/>
  </g>
  <!-- Cápsula -->
  <rect x="90" y="120" width="620" height="260" rx="130" fill="none" stroke="#F9A825" stroke-width="10" stroke-dasharray="14 10"/>
  <!-- Parede celular -->
  <rect x="120" y="145" width="560" height="210" rx="105" fill="#B0BEC5" stroke="#78909C" stroke-width="5"/>
  <!-- Membrana -->
  <rect x="145" y="170" width="510" height="160" rx="80" fill="url(#bact)"/>
  <!-- Nucleoide -->
  <path d="M220 250 q40 -40 80 0 t80 0 t80 0 t60 0" fill="none" stroke="#5C6BC0" stroke-width="8" stroke-linecap="round"/>
  <path d="M240 270 q40 -30 80 0 t80 0 t60 0" fill="none" stroke="#7986CB" stroke-width="5" stroke-linecap="round"/>
  <!-- Ribossomos -->
  <circle cx="540" cy="200" r="10" fill="#FF7043"/><circle cx="580" cy="260" r="10" fill="#FF7043"/>
  <circle cx="560" cy="310" r="10" fill="#FF7043"/><circle cx="610" cy="225" r="10" fill="#FF7043"/>
  <!-- Plasmídeos -->
  <circle cx="500" cy="240" r="24" fill="none" stroke="#AB47BC" stroke-width="8"/>
  <circle cx="540" cy="285" r="18" fill="none" stroke="#CE93D8" stroke-width="7"/>
  <!-- Fímbrias -->
  <g stroke="#26A69A" stroke-width="6" stroke-linecap="round">
    <line x1="670" y1="220" x2="740" y2="210"/><line x1="670" y1="250" x2="745" y2="255"/>
    <line x1="670" y1="280" x2="735" y2="295"/><line x1="670" y1="300" x2="720" y2="325"/>
  </g>
</svg>
