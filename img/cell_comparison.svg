<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f5f5f5"/>
  
  <!-- Procarionte -->
  <g transform="translate(50, 50)">
    <rect width="300" height="300" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="10"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1976D2">Célula Procarionte</text>
    <ellipse cx="150" cy="150" rx="100" ry="80" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <circle cx="150" cy="150" r="30" fill="#64B5F6"/>
    <text x="150" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DNA livre no citoplasma</text>
    <text x="150" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Sem núcleo definido</text>
  </g>
  
  <!-- Eucarionte -->
  <g transform="translate(450, 50)">
    <rect width="300" height="300" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#388E3C">Célula Eucarionte</text>
    <circle cx="150" cy="150" r="100" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="150" cy="150" r="40" fill="#81C784" stroke="#1B5E20" stroke-width="2"/>
    <text x="150" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DNA no núcleo</text>
    <circle cx="120" cy="120" r="15" fill="#A5D6A7"/>
    <circle cx="180" cy="180" r="15" fill="#A5D6A7"/>
    <text x="150" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Com organelas</text>
  </g>
</svg>
